<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWA Help Desk Appointment</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 30px;
            background-color: white;
        }

        .container {
            width: 520px;
            margin: auto;
        }

        .logo {
            width: 110px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 25px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
        }

        fieldset {
            margin-top: 15px;
            margin-bottom: 15px;
            padding: 15px;
        }

        legend {
            padding: 0 5px;
        }

        label {
            display: inline-block;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            font-family: Arial, sans-serif;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            height: 20px;
        }

        .student-id {
            width: 90px;
        }

        .name {
            width: 115px;
        }

        .date {
            width: 145px;
        }

        .time {
            width: 145px;
        }

        textarea {
            width: 275px;
            height: 85px;
            resize: both;
        }

        .buttons {
            margin-top: 10px;
        }

        button {
            padding: 4px 15px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="https://www.swin.edu.au">
        <img src="logo.png" alt="Swinburne University of Technology" class="logo">
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>
        The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.
    </p>

    <p>
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form id="appointmentForm" action="#" method="post" novalidate>

        <fieldset>
            <legend>Student details</legend>

            <label for="studentId">Student ID</label>
            <input
                type="text"
                id="studentId"
                name="studentId"
                class="student-id"
                pattern="[0-9]{7,10}"
                required
                title="Student ID must contain between 7 and 10 digits."
            >

            <br><br>

            <label for="givenName">Given Name</label>
            <input
                type="text"
                id="givenName"
                name="givenName"
                class="name"
                maxlength="15"
                pattern="[A-Za-z ]{1,15}"
                required
                title="Only alphabetic characters are allowed."
            >

            <label for="familyName">Family Name</label>
            <input
                type="text"
                id="familyName"
                name="familyName"
                class="name"
                maxlength="15"
                pattern="[A-Za-z ]{1,15}"
                required
                title="Only alphabetic characters are allowed."
            >
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>

            <input type="radio" id="cos10011" name="unit" value="COS10011" required>
            <label for="cos10011">COS10011</label>

            <input type="radio" id="cos60004" name="unit" value="COS60004">
            <label for="cos60004">COS60004</label>

            <input type="radio" id="cos60007" name="unit" value="COS60007">
            <label for="cos60007">COS60007</label>

            <br><br>

            <label for="tutor">Your Tutor</label>
            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="john">John Smith</option>
                <option value="sarah">Sarah Jones</option>
                <option value="michael">Michael Brown</option>
                <option value="emma">Emma Wilson</option>
                <option value="david">David Lee</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <input type="checkbox" id="html" name="issue" value="HTML" checked>
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="issue" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="javascript" name="issue" value="JavaScript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox" id="php" name="issue" value="PHP">
            <label for="php">PHP</label>

            <input type="checkbox" id="mysql" name="issue" value="MySQL">
            <label for="mysql">MySQL</label>
        </fieldset>

        <fieldset>
            <legend>Description of Issue</legend>
            <textarea id="issueDescription" name="issueDescription" placeholder="Write description of your problem here..."></textarea>
        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <label for="preferredDate">Date</label>
            <input
                type="text"
                id="preferredDate"
                name="preferredDate"
                class="date"
                placeholder="dd/mm/yyyy"
                maxlength="10"
                pattern="^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}$"
                required
                title="Please enter the date in dd/mm/yyyy format."
            >

            <br>

            <label for="preferredTime">Time</label>
            <input
                type="text"
                id="preferredTime"
                name="preferredTime"
                class="time"
                placeholder="00:00"
                maxlength="5"
                pattern="^([01][0-9]|2[0-3]):[0-5][0-9]$"
                required
                title="Please enter the time in 24-hour format, e.g. 14:30."
            >
        </fieldset>

        <div class="buttons">
            <button type="submit">Book</button>
            <button type="reset">Reset form</button>
        </div>

    </form>

</div>

<script src="script.js"></script>
</body>
</html>
